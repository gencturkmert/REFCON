[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "refcon"
version = "1.0.0"
description = "REFCON: reference-free per-gene copy-number inference from scRNA-seq"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "M. Mert Gençtürk", email = "mert.gencturk@bilkent.edu.tr"},
    {name = "A. Ercüment Çiçek", email = "cicek@cs.bilkent.edu.tr"},
]
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "scanpy>=1.10",
    "h5py>=3.10",
]

[project.optional-dependencies]
notebook = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["refcon", "refcon.downstream"]
